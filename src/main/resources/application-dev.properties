# --- Perfil "dev" ---
# Desarrollo local con MySQL en localhost y Mailpit (http://localhost:8025)
# como servidor de correo de pruebas. Actívalo con:
#   SPRING_PROFILES_ACTIVE=dev ./gradlew bootRun
# Solo para desarrollo: nunca uses estos valores en un servidor real.

jwt.secret=${JWT_SECRET:dev-only-jwt-secret-refugio-no-usar-en-produccion-123}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:refugio@localhost}
spring.mail.password=${MAIL_PASSWORD:dev}
spring.mail.properties.mail.smtp.starttls.enable=false

spring.jpa.show-sql=true
