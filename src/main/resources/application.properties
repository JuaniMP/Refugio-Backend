spring.application.name=refugio-backend
server.port=8181

# --- Base de datos ---
# Producción: define DB_URL, DB_USER y DB_PASSWORD como variables de entorno.
# El esquema se crea con database/setup.sh (ddl-auto=none: Hibernate no lo toca).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BD_Veterinaria?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Pool de conexiones (Hikari) ---
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10

# --- JWT ---
# Obligatorio: mínimo 32 caracteres aleatorios (por ejemplo: openssl rand -base64 48)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# --- CORS: orígenes del frontend separados por comas ---
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Correo (Gmail con contraseña de aplicación) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
